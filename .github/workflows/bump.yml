name: Update manifest

# Checks the latest Zeno release every 6 hours and updates bucket/zeno.json (version, URL and hash
# of the portable .zip, taken from the release asset digest). Uses only this repository's own token.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rel=$(gh api repos/chmenegatti/zeno/releases/latest)
          v=$(jq -r '.tag_name | ltrimstr("v")' <<<"$rel")
          cur=$(jq -r .version bucket/zeno.json)
          if [ "$v" = "$cur" ]; then echo "already at $v"; exit 0; fi
          asset=$(jq -c '.assets[] | select(.name | endswith("-windows-portable.zip"))' <<<"$rel")
          url=$(jq -r .browser_download_url <<<"$asset")
          sha=$(jq -r '.digest | ltrimstr("sha256:")' <<<"$asset")
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "no .zip digest in $v"; exit 1; }
          jq --arg v "$v" --arg u "$url" --arg h "$sha" \
            '.version = $v | .architecture."64bit".url = $u | .architecture."64bit".hash = $h' \
            bucket/zeno.json > bucket/zeno.json.new
          mv bucket/zeno.json.new bucket/zeno.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: Zeno $v"
          git push
